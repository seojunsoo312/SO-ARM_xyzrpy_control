# 등록에 쓸 CAD. 파일은 이 폴더에 두고 이름만 바꾼다.
# 코드에 부품 파일명을 넣지 말 것.
mesh: bracket_4035.stl
unit: mm
class: bracket
# STL 파일 축 → 프로젝트 CAD 프레임 (deg, XYZ extrinsic).
# Rx180: 파일 +Z → 프로젝트 +Z(위).
# Ry-90: Y축 기준 (이전 +90에서 180° 더 돌림).
mesh_rpy: [180, -90, 0]

# 시뮬 배치 (프로젝트 베이스 mm/deg, +X 전진). pick 변환에는 안 씀.
place:
  xyz_mm: [150, 150, 2]
  rpy_deg: [0, 0, -90]

# 집기 (CAD 축 mm/deg). T_base_grasp = T_base_cad @ T_cad_grasp
# 숫자는 python pendant/teach_grasp.py 에서 보면서 고친다.
grasp:
  xyz_mm: [0, 0, 0]
  rpy_deg: [0, 0, 0]
  gripper: 50

# 브라켓 접근: pre = L+d, grasp = L+d−a (축 따라 원점 쪽으로 a mm).
approach_d_mm: 10
approach_a_mm: 30

# 픽앤플레이스 실험용 드롭 XY. 아직 확정 아님. Z·RPY는 grasp TCP.
drop:
  xy_mm: [150, -100]
