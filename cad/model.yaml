# 브라켓 집기 정보. 펜던트, 등록, 픽이 이 파일을 읽는다.
# 길이는 mm, 각도는 deg. 축은 +X 앞, +Y 왼쪽, +Z 위.

# 이 폴더에 있는 STL 파일 이름.
mesh: bracket_4035.stl

# STL을 저장할 때 쓴 단위.
unit: mm

# 부품 이름. 카메라가 나누는 자세(세우기, 눕히기, 비스듬히)와는 다른 칸이다.
class: bracket

# STL 축을 위 축에 맞추는 회전 [roll, pitch, yaw].
# 180, -90, 0 이면 파일의 위가 우리 +Z와 맞는다.
mesh_rpy: [180, -90, 0]

# 화면에 브라켓을 올려 두는 위치. 로봇 베이스 기준.
place:
  xyz_mm: [150, 150, 2]
  rpy_deg: [0, 0, -90]

# 손가락이 집을 점. 브라켓 원점 기준.
# python pendant/teach_grasp.py 화면에서 숫자를 고친다.
# gripper 는 0이 닫힘, 100이 완전히 열림. 50은 반만 연 상태.
grasp:
  xyz_mm: [0, 0, 0]
  rpy_deg: [0, 0, 0]
  gripper: 50

# 집기 전에 물체 밖에서 기다리는 거리.
# d: 표면에서 대기 위치까지. a: 대기 위치에서 집기 위치까지 들어가는 거리.
approach_d_mm: 10
approach_a_mm: 30

# 집어 옮긴 뒤 내려놓는 책상 위치의 XY. 로봇 베이스 기준.
# 높이와 손목 각도는 집기 자세를 그대로 쓴다.
drop:
  xy_mm: [150, -100]
